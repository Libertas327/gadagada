<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>实验室安全行为识别工具</title>
    <style>
        body {
            font-family: "微软雅黑", sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 0 20px;
        }
        .upload-box {
            border: 2px dashed #ccc;
            padding: 40px;
            text-align: center;
            margin: 20px 0;
            border-radius: 8px;
        }
        .result-box {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            background: #f5f5f5;
            display: none;
        }
        .risk {
            color: #d93025;
            font-weight: bold;
            font-size: 18px;
        }
        .safe {
            color: #188038;
            font-weight: bold;
            font-size: 18px;
        }
        .item {
            margin: 10px 0;
        }
        a{
            display:inline-block;
            margin-bottom:10px;
        }
        /* 检测结果图容器 */
        .img-container {
            position: relative;
            margin-top: 20px;
        }
        .img-container img {
            max-width: 100%;
            border: 1px solid #ddd;
            border-radius: 4px;
            display: block;
        }
        .img-container canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h2>实验室安全行为识别工具</h2>
    <a href="/historypage">查看检测历史记录</a>
    <div class="upload-box">
        <input type="file" id="fileInput" accept="image/*">
        <br><br>
        <button onclick="uploadImage()" style="padding:8px 20px;cursor:pointer;">开始识别</button>
    </div>

    <div style="margin-top:30px;">
        <h3>📷 摄像头实时安全监控</h3>
        <button onclick="startLive()" style="padding:8px 16px;cursor:pointer;">开启实时监控</button>
        <button onclick="stopLive()" style="padding:8px 16px;cursor:pointer;">停止监控</button>
        <div id="liveContainer" style="margin-top:15px;display:none;">
            <img id="liveImg" src="">
        </div>
    </div>

    <div class="result-box" id="resultBox">
        <h3>识别结果</h3>
        <div id="riskLevel"></div>
        <div class="item">护目镜：<span id="goggles"></span> （置信度：<span id="gogglesConf"></span>）</div>
        <div class="item">手套：<span id="gloves"></span> （置信度：<span id="glovesConf"></span>）</div>
        <div class="item">防护服：<span id="coat"></span> （置信度：<span id="coatConf"></span>）</div>
        <div class="item" style="margin-top:15px;">检测时间：<span id="detectTime"></span></div>
        <!-- 检测结果图容器 -->
        <div class="img-container" id="imgContainer">
            <img id="resultImg" alt="检测结果图">
            <canvas id="resultCanvas"></canvas>
        </div>
    </div>
    <script>
        let alertTimer = null;
        let lastPopAlertTs = 0;

        function uploadImage() {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files[0]) {
                alert('请先选择一张图片');
                return;
            }
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(res => {
                if (res.code === 200) {
                    const data = res.data;
                    const result = data.result;

                    document.getElementById('resultBox').style.display = 'block';

                    // 风险等级
                    const riskEl = document.getElementById('riskLevel');
                    if (data.risk_level === '存在风险') {
                        riskEl.className = 'risk';
                        riskEl.innerText = '⚠ 存在安全风险';
                    } else {
                        riskEl.className = 'safe';
                        riskEl.innerText = '✅ 安全合规';
                    }
                    // 填充各项结果
                    document.getElementById('goggles').innerText = result.goggles;
                    document.getElementById('gogglesConf').innerText = result.goggles_conf;
                    document.getElementById('gloves').innerText = result.gloves;
                    document.getElementById('glovesConf').innerText = result.gloves_conf;
                    document.getElementById('coat').innerText = result.coat;
                    document.getElementById('coatConf').innerText = result.coat_conf;
                    document.getElementById('detectTime').innerText = data.detect_time;
                    // 绘制检测框
                    drawDetectionBoxes(data.filename, data.detections);
                } else {
                    alert(res.msg);
                }
            })
            .catch(err => {
                alert('上传失败：' + err);
            });
        }
        // 在图片上绘制检测框与标签
        function drawDetectionBoxes(filename, detections) {
            const img = document.getElementById('resultImg');
            const canvas = document.getElementById('resultCanvas');
            const container = document.getElementById('imgContainer');
            container.style.display = 'block';
            img.src = '/get_img/' + filename;
            img.onload = function () {
                // 画布尺寸与图片显示尺寸对齐
                canvas.width = img.clientWidth;
                canvas.height = img.clientHeight;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                // 原图坐标 → 页面显示坐标 的缩放比例
                const scaleX = img.clientWidth / img.naturalWidth;
                const scaleY = img.clientHeight / img.naturalHeight;
                // 类别对应配色
                const colorMap = {
                    'gloves': '#ffc107',   // 黄色 - 手套
                    'goggles': '#1976d2',  // 蓝色 - 护目镜
                    'gown': '#7b1fa2'      // 紫色 - 防护服
                };
                detections.forEach(item => {
                    const { x1, y1, x2, y2 } = item.bbox;
                    const rx1 = x1 * scaleX;
                    const ry1 = y1 * scaleY;
                    const rw = (x2 - x1) * scaleX;
                    const rh = (y2 - y1) * scaleY;
                    const color = colorMap[item.class_name] || '#f44336';
                    // 绘制矩形框
                    ctx.strokeStyle = color;
                    ctx.lineWidth = Math.max(2, canvas.width * 0.004);
                    ctx.strokeRect(rx1, ry1, rw, rh);
                    // 绘制标签背景
                    const label = `${item.class_name} ${(item.confidence * 100).toFixed(1)}%`;
                    ctx.font = 'bold 14px "微软雅黑", sans-serif';
                    const textWidth = ctx.measureText(label).width + 12;
                    const textHeight = 22;
                    ctx.fillStyle = color;
                    ctx.fillRect(rx1, ry1 - textHeight, textWidth, textHeight);
                    // 绘制标签文字
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText(label, rx1 + 6, ry1 - 6);
                });
            };
        }

        function startLive(){
            document.getElementById("liveContainer").style.display="block";
            document.getElementById("liveImg").src="/video_feed";
            // 轮询后端告警状态，500ms查一次
            alertTimer = setInterval(async ()=>{
                const resp = await fetch("/get_alert");
                const res = await resp.json();
                if(res.last_alert > lastPopAlertTs){
                    lastPopAlertTs = res.last_alert;
                    // 弹窗通知安全员
                    alert("【安全告警】检测到人员防护装备缺失，请安全员及时前往现场核查！");
                }
            },500);
        }

        function stopLive(){
            document.getElementById("liveContainer").style.display="none";
            document.getElementById("liveImg").src="";
            clearInterval(alertTimer);
        }
    </script>
</body>
</html>
