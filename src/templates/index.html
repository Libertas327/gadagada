<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>实验室安全检测首页</title>
    <style>
        body {width:800px;margin:30px auto;font-family:system-ui;}
        .box{border:1px solid #ccc;padding:20px;border-radius:8px;margin:15px 0;}
    </style>
</head>
<body>
    <h1>实验室安全检测系统</h1>
    <div class="box">
        <h3>图片上传识别</h3>
        <input type="file" id="imgFile" accept="image/*">
        <button onclick="upload()">提交识别</button>
        <div id="result"></div>
        <img id="showImg" style="max-width:400px;margin-top:10px;display:none;">
    </div>
    <div class="box">
        <a href="/monitor">👉 进入实时监控页面</a>
        <br><br>
        <a href="/history">👉 查看历史记录</a>
    </div>

    <script>
        async function upload(){
            const file = document.getElementById("imgFile").files[0];
            if(!file){alert("请选择图片");return;}
            let fd = new FormData();
            fd.append("file", file);
            const res = await fetch("/upload",{method:"POST",body:fd});
            const data = await res.json();
            if(data.ok){
                document.getElementById("result").innerText = "识别结果："+data.msg;
                document.getElementById("showImg").src="/uploads/"+data.imgname;
                document.getElementById("showImg").style.display="block";
            }else{
                document.getElementById("result").innerText = "失败："+data.msg;
            }
        }
    </script>
</body>
</html>
