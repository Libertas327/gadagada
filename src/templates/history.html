<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>历史抓拍记录</title>
    <style>
        body {width:900px;margin:30px auto;font-family:system-ui;}
        .item{border:1px solid #ddd;padding:12px;border-radius:6px;margin:10px 0;display:flex;gap:15px;align-items:center;}
        .item img{width:180px;}
        .del{color:red;cursor:pointer;}
    </style>
</head>
<body>
    <h1>历史违规抓拍记录</h1>
    <a href="/">返回首页</a>
    <a href="/monitor">实时监控</a>
    <div id="list"></div>

    <script>
        async function loadList(){
            const res = await fetch("/api/get_history");
            const data = await res.json();
            const wrap = document.getElementById("list");
            wrap.innerHTML = "";
            data.forEach(row=>{
                const div = document.createElement("div");
                div.className="item";
                div.innerHTML = `
                    <img src="/uploads/${row.img_path}">
                    <div>
                        <div>时间：${row.time}</div>
                        <div>识别内容：${row.result}</div>
                        <div class="del" onclick="del(${row.id})">删除本条记录</div>
                    </div>
                `;
                wrap.appendChild(div);
            })
        }
        async function del(id){
            if(!confirm("确定删除？")) return;
            await fetch(`/api/del_record/${id}`,{method:"POST"});
            loadList();
        }
        loadList();
    </script>
</body>
</html>
